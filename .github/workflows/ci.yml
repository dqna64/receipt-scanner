name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump this to force a fresh vcpkg binary cache (e.g. after a toolchain/OS image bump).
  VCPKG_CACHE_VERSION: v1

jobs:
  build-test:
    name: Build + test (x86_64)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: receipt_scanner
          POSTGRES_PASSWORD: dev_only_change_me
          POSTGRES_DB: receipt_scanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: receipt_scanner
      DB_USER: receipt_scanner
      DB_PASSWORD: dev_only_change_me
      DATABASE_URL: postgres://receipt_scanner:dev_only_change_me@localhost:5432/receipt_scanner?sslmode=disable
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: receipts
      S3_ACCESS_KEY: receipt_scanner
      S3_SECRET_KEY: dev_only_change_me
      S3_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl zip unzip tar git pkg-config \
            autoconf autoconf-archive automake libtool python3 \
            bison flex perl

      - name: Install dbmate
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate

      - name: Run migrations
        run: dbmate up

      # Not a `services:` container: that block has no way to override the image's command,
      # and minio/minio needs `server /data` args to actually run (spec Step 6 -- same
      # command as docker-compose.yml's minio service). A plain `docker run` gives full
      # control, matching Compose exactly.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=receipt_scanner -e MINIO_ROOT_PASSWORD=dev_only_change_me \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ env.VCPKG_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('scripts/fetch-vcpkg.sh', 'vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_CACHE_VERSION }}-${{ runner.os }}-

      - name: Fetch vcpkg
        run: ./scripts/fetch-vcpkg.sh vcpkg

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan/UBSan (x86_64)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: receipt_scanner
          POSTGRES_PASSWORD: dev_only_change_me
          POSTGRES_DB: receipt_scanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: receipt_scanner
      DB_USER: receipt_scanner
      DB_PASSWORD: dev_only_change_me
      DATABASE_URL: postgres://receipt_scanner:dev_only_change_me@localhost:5432/receipt_scanner?sslmode=disable
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: receipts
      S3_ACCESS_KEY: receipt_scanner
      S3_SECRET_KEY: dev_only_change_me
      S3_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl zip unzip tar git pkg-config \
            autoconf autoconf-archive automake libtool python3 \
            bison flex perl

      - name: Install dbmate
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate

      - name: Run migrations
        run: dbmate up

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=receipt_scanner -e MINIO_ROOT_PASSWORD=dev_only_change_me \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ env.VCPKG_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('scripts/fetch-vcpkg.sh', 'vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_CACHE_VERSION }}-${{ runner.os }}-

      - name: Fetch vcpkg
        run: ./scripts/fetch-vcpkg.sh vcpkg

      # Sanitizer flags apply only to our own translation units (CMAKE_CXX_FLAGS doesn't
      # touch vcpkg's already-built static libs) — enough to catch bugs in our code, which
      # is what this project's own code actually needs covered.
      - name: Configure (ASan/UBSan)
        run: |
          cmake -S . -B build-san \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-san -j

      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  docker-amd64:
    name: Docker build (amd64 deploy image)
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build-only: this proves the amd64 deploy image builds in CI (the ONLY place it's
      # ever produced — never cross-built on the Mac). Pushing it to a registry is Step 18.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
